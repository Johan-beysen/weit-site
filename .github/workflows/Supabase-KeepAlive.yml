# .github/workflows/supabase-keepalive.yml
name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 10 * * 1,5'  # elke maandag en vrijdag om 10u UTC
  workflow_dispatch:          # ook manueel triggerable vanuit de GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.PUBLIC_SUPABASE_URL }}/rest/v1/clients?select=id&limit=1" \
            -H "apikey: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}")
          echo "Response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Unexpected status code: $STATUS"
            exit 1
          fi